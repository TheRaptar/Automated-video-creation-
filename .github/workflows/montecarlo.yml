name: Monte Carlo test (stock picking vs random)

# Does the multi-factor strategy beat RANDOM stock picking with the same timing, turnover and costs?
# Like the other workflows, this file must live in the repo's ROOT folder  .github/workflows/
on:
  workflow_dispatch:
    inputs:
      regime:
        description: "Market filter of the strategy to test"
        type: choice
        options: [trend, macro, none]
        default: trend
      null_runs:
        description: "Number of random-picking replays"
        default: "300"
      years:
        description: "Years of history"
        default: "10"

defaults:
  run:
    working-directory: trading-bot

jobs:
  montecarlo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Self-tests
        run: pytest -q
      - name: Monte Carlo on real NSE data
        run: python run_montecarlo.py --data yahoo --years ${{ inputs.years }} --null-runs ${{ inputs.null_runs }} --macro --set regime=${{ inputs.regime }}
      - name: Show report in the run summary
        if: always()
        run: cat reports/montecarlo/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: montecarlo-${{ inputs.regime }}
          path: trading-bot/reports/
