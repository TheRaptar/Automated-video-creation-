name: Generate daily video

on:
  schedule:
    - cron: "30 4 * * *"   # every day at 04:30 UTC (10:00 AM India time)
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: Automated-video-creation

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Generate video (random topic)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python make_video.py

      - name: Save video as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: Automated-video-creation/output/
          retention-days: 14

      - name: Remember topic so it is never repeated
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || (git commit -m "Update topic history" && git push)

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: private      # change to public once your API project is approved
        run: python upload_youtube.py
