name: Generate and publish videos

# Quality-focused schedule (UTC): 3 focused slots per day instead of high-frequency scatter:
#   Slot 1 (08:00 UTC): 1x Animated Reel / Short
#   Slot 2 (13:30 UTC): 1x High-Retention Long-Form Video
#   Slot 3 (18:00 UTC): 1x Vertical YouTube Short / Story

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "30 13 * * *"
    - cron: "0 18 * * *"

  workflow_dispatch:
    inputs:
      format:
        description: "Video format (animated, short, story, or long)"
        type: choice
        options:
          - animated
          - short
          - story
          - long
        default: animated
        required: true

      language:
        description: "Primary language (recommend fixed channel language 'en', or pick another)"
        type: choice
        options:
          - en
          - ta
          - hi
          - es
          - fr
          - pt
          - de
          - ja
          - ko
          - ar
          - id
          - auto
        default: en
        required: false

      dub_languages:
        description: "Optional comma-separated extra dubs (e.g. ta,hi,es)"
        type: string
        required: false

      categories:
        description: "Optional custom theme/niche"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: video-bot
  cancel-in-progress: false

defaults:
  run:
    working-directory: Automated-video-creation

jobs:
  make-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      INPUT_FORMAT: ${{ github.event.inputs.format || '' }}
      TARGET_LANGUAGE: ${{ github.event.inputs.language || 'en' }}
      DUB_LANGUAGES: ${{ github.event.inputs.dub_languages || '' }}
      CATEGORIES: ${{ github.event.inputs.categories || '' }}

      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TZ: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine effective format
        id: pick_format
        run: |
          if [ -n "$INPUT_FORMAT" ]; then
            FMT="$INPUT_FORMAT"
          else
            UTC_HOUR=$(date -u +%H)
            case "$UTC_HOUR" in
              08) FMT="animated" ;;
              13) FMT="long" ;;
              *)  FMT="short" ;;
            esac
          fi
          echo "EFFECTIVE_FORMAT=$FMT" >> "$GITHUB_ENV"
          echo "VIDEO_FORMAT=$FMT" >> "$GITHUB_ENV"
          echo "Effective video format selected: $FMT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Automated-video-creation/requirements.txt

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-noto-core \
            fonts-noto-cjk
          ffmpeg -version

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate AI video (Growth, SEO, Thumbnails & QC)
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

          TRENDS: "1"
          ANIMATED_MODE: "auto"
          FREE_VIDEO_PROVIDER: "auto"
          VIDEO_AI_CLIPS_MAX: "8"
          ENABLE_BGM: "1"
          BGM_VOLUME: "0.14"
          QC_MIN_SCORE: "6.5"

          # Topic-adaptive durations (not arbitrarily rigid)
          VIDEO_SECONDS: "30-50"
          LONG_SECONDS: "300-420"

        run: |
          echo "=================================="
          echo "Video format: $EFFECTIVE_FORMAT"
          echo "Primary language: ${TARGET_LANGUAGE:-en}"
          echo "Dub languages: ${DUB_LANGUAGES:-none}"
          echo "Categories: ${CATEGORIES:-AI-selected topics}"
          echo "=================================="

          ARGS=("--format" "$EFFECTIVE_FORMAT")
          if [ -n "$TARGET_LANGUAGE" ]; then
            ARGS+=("--lang" "$TARGET_LANGUAGE")
          fi
          if [ -n "$DUB_LANGUAGES" ]; then
            ARGS+=("--dub" "$DUB_LANGUAGES")
          fi

          python make_video.py "${ARGS[@]}"

      - name: Save generated videos, thumbnails & QC reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: videos-${{ github.run_number }}-${{ env.EFFECTIVE_FORMAT }}
          path: Automated-video-creation/output/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload to YouTube & Sync Analytics
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: public
          YT_ANALYTICS_SYNC: "1"
          QC_STRICT: "1"
          QC_MIN_SCORE: "6.5"
          MAX_SHORTS_PER_DAY: "2"
          MAX_LONG_PER_DAY: "1"
          MAX_UPLOADS_PER_DAY: "4"
        run: |
          python upload_youtube.py

      - name: Post Short/Animated Reel to Instagram
        if: steps.generate.outcome == 'success' && env.EFFECTIVE_FORMAT != 'long'
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_PASSPHRASE: ${{ secrets.IG_TOKEN_PASSPHRASE }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          MAX_IG_POSTS_PER_DAY: "3"
        run: |
          python upload_instagram.py

      - name: Save history, analytics learnings and publish logs
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"

          git add history.json state.json ig_token.enc 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "Update video history, trends and analytics learnings"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No history or state changes to commit."
          fi
