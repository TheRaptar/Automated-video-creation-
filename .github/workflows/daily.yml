name: Generate and publish videos

# All cron times are UTC.
# Scheduled throughout the 24-hour cycle at global peak viewing times:
# Slot 1: 01:00 UTC = 06:30 AM IST / 05:00 PM PST (Day before)
# Slot 2: 04:30 UTC = 10:00 AM IST / 08:30 PM PST (Day before)
# Slot 3: 08:00 UTC = 01:30 PM IST / 12:00 AM PST
# Slot 4: 11:30 UTC = 05:00 PM IST / 03:30 AM PST
# Slot 5: 15:00 UTC = 08:30 PM IST / 07:00 AM PST
# Slot 6: 18:30 UTC = 12:00 AM IST / 10:30 AM PST
# Slot 7: 22:00 UTC = 03:30 AM IST / 02:00 PM PST

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "30 4 * * *"
    - cron: "0 8 * * *"
    - cron: "30 11 * * *"
    - cron: "0 15 * * *"
    - cron: "30 18 * * *"
    - cron: "0 22 * * *"

  workflow_dispatch:
    inputs:
      format:
        description: "Video format (Shorts & Reels by default)"
        type: choice
        options:
          - short
          - story
          - long
        default: short
        required: true

      categories:
        description: "Optional custom theme/niche (e.g. luxury lifestyle, aesthetic charm, cyberpunk, mindset)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: video-bot
  cancel-in-progress: false

defaults:
  run:
    working-directory: Automated-video-creation

jobs:
  make-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      VIDEO_FORMAT: ${{ github.event.inputs.format || 'short' }}
      CATEGORIES: ${{ github.event.inputs.categories || '' }}

      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TZ: Asia/Kolkata

    steps:
      # 1. Get the latest source code
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Set up Python with dependency caching
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Automated-video-creation/requirements.txt

      # 3. Install FFmpeg and fonts
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-dejavu-core \
            fonts-liberation
          ffmpeg -version

      # 4. Install Python dependencies
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 5. Generate the video using the AI services configured in make_video.py
      - name: Generate AI video
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

          # Optional YouTube API key for trend research/performance feedback
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

          # Enable trend research
          TRENDS: "1"

          # Video duration settings
          VIDEO_SECONDS: "40-60"
          LONG_SECONDS: "300-420"

        run: |
          echo "=================================="
          echo "Video format: $VIDEO_FORMAT"
          echo "Categories: ${CATEGORIES:-AI-selected topics}"
          echo "=================================="

          python make_video.py

      # 6. Save generated videos as downloadable artifacts
      - name: Save generated videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: videos-${{ github.run_number }}-${{ env.VIDEO_FORMAT }}
          path: Automated-video-creation/output/
          retention-days: 14
          if-no-files-found: ignore

      # 7. Upload to YouTube
      - name: Upload to YouTube
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: public
          MAX_UPLOADS_PER_DAY: "10"
        run: |
          python upload_youtube.py

      # 8. Publish Shorts and Stories to Instagram
      - name: Post to Instagram
        if: steps.generate.outcome == 'success' && env.VIDEO_FORMAT != 'long'
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_PASSPHRASE: ${{ secrets.IG_TOKEN_PASSPHRASE }}

          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

          MAX_IG_POSTS_PER_DAY: "10"
        run: |
          python upload_instagram.py

      # 9. Save generation history and state
      - name: Save history, trends and logs
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"

          git add history.json state.json ig_token.enc 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "Update video generation history"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No history or state changes to commit."
          fi
