name: Generate and publish videos

# Weekly plan (all times UTC, India time in brackets):
#   Short A  every day              04:30 (10:00 AM)
#   Long     Tue / Thu / Sat        10:30 (04:00 PM)   <- long-form videos
#   Short B  every day              14:30 (08:00 PM)
# = 14 Shorts + 3 long videos per week, at least 3.5 hours apart.
on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 10 * * 2,4,6"
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      format:
        description: "Which kind of video to make now?"
        type: choice
        options: [short, long]
        default: short

permissions:
  contents: write

concurrency:
  group: video-bot
  cancel-in-progress: false

defaults:
  run:
    working-directory: Automated-video-creation

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VIDEO_FORMAT: ${{ github.event.inputs.format || (github.event.schedule == '30 10 * * 2,4,6' && 'long' || 'short') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VIDEO_SECONDS: "40-60"        # Short length range in seconds
          LONG_SECONDS: "300-420"       # long-form length range in seconds (5-7 minutes)
          # CATEGORIES: "space,physics,ocean life"   # uncomment to focus on a niche
        run: python make_video.py

      - name: Save video as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}-${{ env.VIDEO_FORMAT }}
          path: Automated-video-creation/output/
          retention-days: 14

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: public
          MAX_UPLOADS_PER_DAY: "5"
        run: python upload_youtube.py

      - name: Save topic history and upload log
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add history.json || true
          git add state.json || true
          git diff --staged --quiet || (git commit -m "Update history" && git pull --rebase && git push)
